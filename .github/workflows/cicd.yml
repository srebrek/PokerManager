name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet run scripts/build.cs -- --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet run scripts/coverage.cs -- --no-build --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Production

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage-report

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      "ConnectionStrings__PokerManager-db": ${{ secrets.DB_CONNECTION_STRING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Generate Wolverine code
        run: dotnet run scripts/build.cs -- --configuration Release

      - name: Install Aspire CLI
        run: |
          curl -fsSL https://aspire.dev/install.sh | bash -s -- --version 13.5.3
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: aspire deploy --environment Production --non-interactive

      - name: Run migrations
        run: |
          execution=$(az containerapp job start \
            --name migrations \
            --resource-group "$Azure__ResourceGroup" \
            --query name \
            --output tsv)

          echo "Execution: $execution"

          for _ in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --name migrations \
              --resource-group "$Azure__ResourceGroup" \
              --job-execution-name "$execution" \
              --query properties.status \
              --output tsv)

            case "$status" in
              Succeeded)
                echo "Migrations succeeded"
                exit 0
                ;;
              Failed | Degraded | Stopped)
                echo "Migrations $status"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Migrations timed out, last status: $status"
          exit 1

      - name: Smoke test
        run: |
          fqdn=$(az containerapp show \
            --name apiservice \
            --resource-group "$Azure__ResourceGroup" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          for _ in $(seq 1 20); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "https://$fqdn/health" || true)

            if [ "$status" = "200" ]; then
              echo "Healthy: https://$fqdn"
              exit 0
            fi

            sleep 10
          done

          echo "Health check failed, last status: $status"
          exit 1
