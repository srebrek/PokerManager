name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet run scripts/build.cs -- --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet run scripts/coverage.cs -- --no-build --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Production

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage-report
